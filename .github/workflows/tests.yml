name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    # The floor the scripts promise (3.9) and a current Python, on the two systems projects use.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
        include:
          # ubuntu-latest no longer carries 3.9
          - {os: ubuntu-24.04, python: '3.9'}
          - {os: windows-latest, python: '3.9'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements-dev.txt
      - run: python -m pytest tests -q
